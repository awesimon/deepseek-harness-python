[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-harness-python"
version = "0.1.0.dev0"
description = "Python backend runtime for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["aiohttp>=3.11,<4", "jsonschema>=4.23,<5"]

[project.scripts]
deepseek-harness-python = "harness.host:main"

[dependency-groups]
dev = [
    "playwright>=1.58,<2",
    "pyright>=1.1.400,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]

[tool.setuptools.package-data]
"harness.protocol" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["harness"]
