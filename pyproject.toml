[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-harness-python"
version = "0.1.0.dev0"
description = "Python backend runtime for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pyright>=1.1.400,<2", "ruff>=0.12,<1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
